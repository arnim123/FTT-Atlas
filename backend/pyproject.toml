[project]
name = "atlas-backend"
version = "0.1.0"
description = "Atlas knowledge system API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "pydantic>=2.10",
  "pyjwt>=2.10",
  "google-auth>=2.36",
  "google-api-python-client>=2.154",
  "requests>=2.32",
  "python-multipart>=0.0.17",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "mcp==2.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`",
]
